name: Actualizacion Automatica de Vacantes

on:
  schedule:
    # Se ejecuta todos los días a las 01:00 UTC (20:00 / 8:00 PM hora Colombia)
    - cron: '0 1 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Bot de Rastreo
        run: |
          python bot_practicas.py

      - name: Preparar archivo para GitHub Pages
        run: |
          cp dashboard_practicas.html index.html

      - name: Guardar y publicar cambios actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard_practicas.html vacantes_practicas.json vacantes_practicas.csv feed.xml
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Vacantes de Ingeniería Física [$(date '+%Y-%m-%d')]"
            git push origin main
          else
            echo "No hay cambios nuevos en las vacantes."
          fi
