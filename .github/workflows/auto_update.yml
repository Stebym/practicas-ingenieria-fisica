name: Bot de Practicas

on:
  schedule:
    # Dos veces al día en minutos fuera de hora pico UTC (07:17 y 19:17 hora Colombia).
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón en GitHub

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    # Margen amplio de hasta 5 horas (300 min) para rastrear todas las fuentes y empresas sin prisa.
    timeout-minutes: 300
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot_practicas.py
        run: python bot_practicas.py

      - name: Guardar datos actualizados
        # Solo se suben los datos de este bot; la página la arma
        # "Construir y publicar página" al terminar este flujo.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vacantes_practicas.json vacantes_practicas.csv
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos."
            exit 0
          fi
          git commit -m "Auto-update: Vacantes de Ingeniería Física [$(date '+%Y-%m-%d')]"
          # Otros bots pueden haber subido sus datos mientras tanto.
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((intento * 10))
          done
          exit 1
